log_format cubetastic_privacy '$remote_addr $request_method $uri $status $body_bytes_sent';
server {
    listen 80;
    server_name cubetastic.duckdns.org;
    access_log /var/log/nginx/cubetastic.access.log cubetastic_privacy;
    location /.well-known/acme-challenge/ { root /var/www/cubetastic-acme; }
    location / { return 301 https://cubetastic.duckdns.org$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name cubetastic.duckdns.org;
    access_log /var/log/nginx/cubetastic.access.log cubetastic_privacy;
    ssl_certificate /etc/letsencrypt/live/cubetastic.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cubetastic.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json image/svg+xml font/ttf;
    # Public files bypass Python and session/database work entirely.
    # Old releases remain addressable for tabs opened before a deployment.
    location ~ "^/assets/([a-f0-9]{40})/((?:js|css|images|fonts|audio|videos)/.+)$" {
        alias /opt/cubetastic/releases/$1/$2;
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        access_log off;
    }
    # Legacy runtime/CSS URLs must revalidate across deployments.
    location ~ ^/(js|css|images|fonts|audio|videos)/ {
        root /opt/cubetastic/current;
        try_files $uri =404;
        gzip_static on;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        access_log off;
    }
    location / {
        proxy_pass http://127.0.0.1:8033;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
}
