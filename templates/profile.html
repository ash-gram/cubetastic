{% extends 'layout.html' %}
{% block title %}Cubetastic | Your account{% endblock %}
{% block body %}
<link rel="stylesheet" href="/css/accounts.css">
<section class="account-card"><h1 id="accountName">Your account</h1><p id="accountEmail"></p><p><a href="/timer">Open timer</a> · <a href="#" onclick="signOutUser();return false">Sign out</a></p>
<form onsubmit="submitAccount(event, '/api/profile')">
<label for="phone">Phone (optional)</label><input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="500">
<label for="location">Location (optional)</label><input id="location" name="location" maxlength="500">
<label for="bio">About you (optional)</label><textarea id="bio" name="bio" maxlength="500"></textarea>
<button type="submit">Save profile</button><p role="status" aria-live="polite"></p></form>
<h2>Change password</h2><form onsubmit="submitAccount(event, '/api/password')">
<label for="current_password">Current password</label><input id="current_password" name="current_password" type="password" autocomplete="current-password" required maxlength="256">
<label for="password">New password (at least 12 characters)</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
<button type="submit">Change password</button><p role="status" aria-live="polite"></p></form></section>
{% endblock %}
{% block javascript %}<script src="/js/profile.js"></script>{% endblock %}
