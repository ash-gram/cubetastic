{% extends 'layout.html' %}
{% block title %}Cubetastic | Feedback{% endblock %}
{% block body %}
<link rel="stylesheet" href="/css/accounts.css">
<section class="account-card"><h1>Share feedback</h1><p>Your feedback is saved on this Cubetastic server for its operator.</p>
<form id="feedbackForm"><label for="title">Title</label><input id="title" name="title" required maxlength="200">
<label for="message">Message</label><textarea id="message" name="message" required maxlength="5000" rows="6"></textarea>
<button type="submit">Send feedback</button><p role="status" aria-live="polite"></p></form></section>
{% endblock %}
{% block javascript %}<script>
document.querySelector('#feedbackForm').addEventListener('submit',async function(event){
  event.preventDefault(); const button=this.querySelector('button'); const status=this.querySelector('[role=status]');button.disabled=true;
  try {await account.ready;const response=await fetch('/sendFeedback',{method:'POST',headers:{'X-CSRF-Token':account.csrf},body:new FormData(this)});
    if(!response.ok)throw new Error((await response.json()).error);status.textContent='Thanks, your feedback was saved.';this.reset();
  }catch(error){status.textContent=error.message;}finally{button.disabled=false;}
});
</script>{% endblock %}
